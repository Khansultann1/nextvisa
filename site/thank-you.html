<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#101b2d">
<title>Өтінім жіберілді — NextVisa</title>
<link rel="stylesheet" href="/assets/css/style.css">
<style>
.success-wrap{min-height:100vh;background:#101b2d;color:white;display:grid;place-items:center;text-align:center;padding:30px}
.success-card{max-width:620px}
.success-card .brand{margin-bottom:45px}
.success-card h1{font:500 clamp(42px,7vw,66px)/1.1 'Playfair Display',Georgia,serif;color:#fff}
.success-card h1 em{color:#d6b46a;font-style:normal}
.success-card p{color:#b9c4d1;line-height:1.8;max-width:520px;margin:20px auto 30px}
.success-card .button{display:inline-block;padding:15px 22px;background:#d6b46a;color:#101b2d;font-weight:700}
.success-langs{position:absolute;right:22px;top:22px}
</style>
</head>
<body>
<main class="success-wrap">
<div class="success-langs lang-switch" aria-label="Тілді таңдау">
<button type="button" data-lang="kk">KZ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button>
</div>
<div class="success-card">
<a class="brand" href="/">NEXT<span>VISA</span><i>TRAVEL & VISA SUPPORT</i></a>
<p class="eyebrow" style="justify-content:center">THANK YOU</p>
<h1>Рақмет!<br><em>Өтінім жіберілді.</em></h1>
<p>Форма өтінімді қабылдады. NextVisa командасы сұранысты қарап, байланыс дерегіңіз арқылы сізбен хабарласады.</p>
<a class="button" href="/">Басты бетке оралу ↗</a>
</div>
</main>
<script src="/assets/js/page-language.js" defer></script>
</body>
</html>
